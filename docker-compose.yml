services:
  app:
    build: { context: ., dockerfile: Dockerfile }
    image: kith-space-app:latest
    container_name: kith-space-app
    profiles: ["app"]
    env_file: [.env.docker]
    ports: ["${APP_PORT:-7788}:7788"]
    volumes: ["kithdata:/data/kith-space"]
    restart: unless-stopped

volumes:
  kithdata: {}
