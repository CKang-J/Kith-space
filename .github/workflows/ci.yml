name: CI

# During active development, run the full matrix after changes reach main or when requested manually.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.13.1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck root and web
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm test --unit

      - name: Integration tests
        run: pnpm test --integration

      - name: Build production Desktop bundles
        # desktop:bundle includes the production web build, so do not build web twice here.
        run: pnpm run desktop:bundle

      - name: Audit production dependencies
        if: runner.os == 'Linux'
        run: pnpm audit --prod --audit-level=high
