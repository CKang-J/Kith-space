name: CI

# Keep the Personal AgentOS code, tests, and production Desktop bundles healthy on every push / PR.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck root and web
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm test --unit

      - name: Integration tests
        run: pnpm test --integration

      - name: Build production Desktop bundles
        # desktop:bundle includes the production web build, so do not build web twice here.
        run: pnpm run desktop:bundle

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
