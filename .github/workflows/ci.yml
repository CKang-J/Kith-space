name: CI

# Temporarily manual-only during early iteration; re-enable the auto gate (push to main) when ready.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.13.1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck root and web
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm test --unit

      - name: Integration tests
        if: github.event_name == 'workflow_dispatch'
        run: pnpm test --integration

      - name: Build production Desktop bundles
        # desktop:bundle includes the production web build, so do not build web twice here.
        if: github.event_name == 'workflow_dispatch'
        run: pnpm run desktop:bundle

      - name: Audit production dependencies
        if: github.event_name == 'workflow_dispatch'
        run: pnpm audit --prod --audit-level=high
