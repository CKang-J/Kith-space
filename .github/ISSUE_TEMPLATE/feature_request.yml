name: Feature request
description: Suggest an improvement to the Kith-space AgentOS
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Kith-space. Please search existing issues first.
        Do not include access tokens, provider credentials, private messages, or other secrets.

  - type: dropdown
    id: area
    attributes:
      label: Product area
      description: Which part of Kith-space would this improve?
      options:
        - Desktop shell and Spaces
        - Agents and local runtimes
        - Channels, messages, or tasks
        - Local or LAN browser access
        - Packaging and installation
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Motivation
      description: >
        What problem are you trying to solve, or what workflow would this
        improve? Concrete examples help.
      placeholder: "When I work in a Space with local agents, I have to manually..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: >
        Describe the change you would like to see. Be as specific as you can:
        API shape, UI flow, config option, etc.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: >
        Describe other approaches you tried or considered and why they did not fit.
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: >
        Add mockups, links to related issues, prior art, or other relevant context.
    validations:
      required: false
