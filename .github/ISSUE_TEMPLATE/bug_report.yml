name: Bug report
description: Something is broken or behaving unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, search existing issues to avoid duplicates.
        Do not paste access Tokens, provider credentials, private messages, or other secrets into a public issue.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you were doing when it occurred.
      placeholder: "When I do X, Y happens. I expected Z."
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence, starting from launching Kith-space.
      placeholder: |
        1. Launch Kith-space Desktop
        2. Open a Space and ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include redacted logs or screenshots when useful.
    validations:
      required: true

  - type: input
    id: desktop_version
    attributes:
      label: Kith-space Desktop version
      description: Use the installed application version, commit, or "dev" for a source checkout.
      placeholder: "0.1.0 / commit 1a2b3c4 / dev"
    validations:
      required: true

  - type: input
    id: windows_version
    attributes:
      label: Windows version
      description: Include edition, release, and architecture when known.
      placeholder: "Windows 11 24H2 x64"
    validations:
      required: true

  - type: dropdown
    id: web_mode
    attributes:
      label: Desktop Web mode
      description: Which mode was selected in Desktop Settings when the problem occurred?
      options:
        - "Off (Electron window only)"
        - "Local browser access"
        - "LAN browser access"
        - "Not applicable or unknown"
    validations:
      required: true

  - type: input
    id: runtime
    attributes:
      label: Agent runtime (if applicable)
      description: Which local runtime and version was the affected agent using?
      placeholder: "Claude Code 2.x / Codex / opencode / not applicable"
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Add relevant redacted logs, browser details, screenshots, or related issues.
    validations:
      required: false
